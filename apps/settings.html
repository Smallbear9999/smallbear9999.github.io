<html>

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/java.js" defer></script>
</head>

<body class="web-bg">
<div class="phone-container roboto-font">
    <div class="phone">
        <div class="phone-screen">
            <div class="phone-status-bar">
                <span class="time"></span> 
                <span class="signal"><img src="/images/signalbar.png"></span>
                <span class="signal4g">4G</span>
                <span class="battery"></span></span>
            </div>
            <!--START OF PHONE SCREEN-->
                <div class="phone-content settings-content">
                   <!-- User ID Section -->
                   <div class="settings-user-header">
                    <div class="user-avatar">
                        <img src="/images/user-avatar.jpg" alt="User Avatar">
                    </div>
                    <div class="user-info">
                        <div class="user-name">Lana Poullos</div>
                        <div class="user-device">Luma Phone 13</div>
                        <div class="user-serial">Luma Glasses ID: LGX-9421-A5C</div>
                    </div>
                </div>
                   
                   <!-- Settings Content Section -->
                   <div class="settings-section">
                        <div class="settings-item">General</div>
                        <div class="settings-item">Control Center</div>
                        <div class="settings-item">Display & Brightness</div>
                        <div class="settings-item">Privacy & Security</div>
                    </div>
                   
                   <div class="settings-section">
                        <div class="settings-item">Wi-Fi</div>
                        <div class="settings-item">Bluetooth</div>
                        <div class="settings-item">Mobile Data</div>
                        <div class="settings-item">Personal Hotspot</div>
                    </div>
                    
                    <div class="settings-section">
                        <div class="settings-item">Notifications</div>
                        <div class="settings-item">Sounds & Haptics</div>
                        <div class="settings-item">Focus</div>
                        <div class="settings-item">Screen Time</div>
                    </div>


                </div>
            <!--END OF PHONE SCREEN-->
        </div>
        <a href="/index.html"><div class="phone-home-button"></div></a>
    </div>
</div>
</body>

</html>
