<html>

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/java.js" defer></script>
</head>

<body class="web-bg">
<div class="phone-container roboto-font">
    <div class="phone">
        <div class="phone-screen">
            <div class="phone-status-bar">
                <span class="time"></span> 
                <span class="signal"><img src="/images/signalbar.png"></span>
                <span class="signal4g">4G</span>
                <span class="battery"></span></span>
            </div>
            <!--START OF PHONE SCREEN-->
                <div class="phone-content" style="background: #000000;">
                    <div class="spotify-app">
                        <div class="spotify-logo">
                            <img src="/images/spotify.png" alt="Spotify">
                        </div>
                        <div class="loading-text" id="spotifyStatus">
                            Connecting to Luma Network...
                        </div>
                        <div class="spinner" id="spotifySpinner"></div>
                    </div>
                </div>
            <!--END OF PHONE SCREEN-->
        </div>
        <a href="/index.html"><div class="phone-home-button"></div></a>
    </div>
</div>
</body>

</html>
