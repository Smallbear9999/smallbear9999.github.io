<html>

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/java.js" defer></script>
</head>

<body class="web-bg">
<div class="phone-container roboto-font">
    <div class="phone">
        <div class="phone-screen">
            <div class="phone-status-bar">
                <span class="time"></span> 
                <span class="signal"><img src="/images/signalbar.png"></span>
                <span class="signal4g">4G</span>
                <span class="battery"></span></span>
            </div>
            <!--START OF PHONE SCREEN-->
            <div class="phone-content phone-app">
                <div class="phone-header">Recent Calls</div>
                <div class="call-list">
                  
                  <div class="call-item">
                    <div class="call-icon outgoing" title="Outgoing Call">➡️</div>
                    <div class="call-info">
                      <div class="call-name">Bright</div>
                      <div class="call-time">Today, 3:07 PM</div>
                    </div>
                  </div>

                  <div class="call-item">
                    <div class="call-icon incoming" title="Incoming Call">⬅️</div>
                    <div class="call-info">
                      <div class="call-name">Nova Chen</div>
                      <div class="call-time">Today, 8:22 AM</div>
                    </div>
                  </div>
      
                  <div class="call-item">
                    <div class="call-icon outgoing" title="Outgoing Call">➡️</div>
                    <div class="call-info">
                      <div class="call-name">Luma Support</div>
                      <div class="call-time">Yesterday, 3:45 PM</div>
                    </div>
                  </div>
      
                  <div class="call-item">
                    <div class="call-icon missed" title="Missed Call">❌</div>
                    <div class="call-info">
                      <div class="call-name">Mum</div>
                      <div class="call-time">Yesterday, 11:05 AM</div>
                    </div>
                  </div>
      
                  <div class="call-item">
                    <div class="call-icon incoming" title="Incoming Call">⬅️</div>
                    <div class="call-info">
                      <div class="call-name">Tim Chalken</div>
                      <div class="call-time">Yesteday, 6:22 AM</div>
                    </div>
                  </div>
      
                  
                </div>
              </div>
            <!--END OF PHONE SCREEN-->
        </div>
        <a href="/index.html"><div class="phone-home-button"></div></a>
    </div>
</div>
</body>

</html>
