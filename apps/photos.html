<html>

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/java.js" defer></script>
</head>

<body class="web-bg">
<div class="phone-container roboto-font">
    <div class="phone">
        <div class="phone-screen">
            <div class="phone-status-bar">
                <span class="time"></span> 
                <span class="signal"><img src="/images/signalbar.png"></span>
                <span class="signal4g">4G</span>
                <span class="battery"></span></span>
            </div>
            <!--START OF PHONE SCREEN-->
                <div class="phone-content">
                    <div class="photo-album">
                        <div class="photo-grid">
                            <img src="/images/photo1.jpg" class="photo-thumb" alt="Photo 1">
                            <img src="/images/photo2.jpg" class="photo-thumb" alt="Photo 2">
                            <img src="/images/photo3.jpg" class="photo-thumb" alt="Photo 3">
                            <img src="/images/photo4.jpg" class="photo-thumb" alt="Photo 4">
                            <img src="/images/photo5.jpg" class="photo-thumb" alt="Photo 5">
                            <img src="/images/photo6.jpg" class="photo-thumb" alt="Photo 6">
                            <img src="/images/photo7.jpg" class="photo-thumb" alt="Photo 7">
                            <img src="/images/photo8.jpg" class="photo-thumb" alt="Photo 8">   
                            <img src="/images/photo9.jpg" class="photo-thumb" alt="Photo 9">   
                        </div>
                    </div>
                </div>
            <!--END OF PHONE SCREEN-->
        </div>
        <a href="/index.html"><div class="phone-home-button"></div></a>
    </div>
</div>
</body>

</html>
